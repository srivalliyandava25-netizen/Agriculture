<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'><path d='M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2zm1 14.5V13h2a3 3 0 0 0 0-6h-4v9.5h2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitti Mitra — Better Soil. Better Crops. Better Livelihood.</title>
    <meta name="description" content="AI-Powered Smart Farming and Farmer Livelihood Platform for Sustainable Agriculture in India" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fbfaf6] text-slate-800 antialiased selection:bg-primary-100 selection:text-primary-900 font-sans min-h-screen">
    <div id="root"></div>
    <script>
      (function initializeSavedLanguage() {
        var supported = ['en','hi','bn','te','ta','mr','gu','kn','ml','pa','or','ur','as','ks','kok','mai','mni','ne','sd','sa','sat','brx','doi','lus','kha','trp'];
        var saved = localStorage.getItem('mittimitra_lang');
        var language = supported.indexOf(saved) !== -1 ? saved : 'en';

        document.documentElement.lang = language;
        if (saved !== language) localStorage.setItem('mittimitra_lang', language);

        var hostname = window.location.hostname;
        var domains = [''];
        if (hostname && hostname !== 'localhost' && !/^\d{1,3}(\.\d{1,3}){3}$/.test(hostname)) {
          var cleanHostname = hostname.replace(/^www\./, '');
          domains.push(cleanHostname);
          domains.push('.' + cleanHostname);
          var parts = cleanHostname.split('.');
          for (var index = 1; index < parts.length - 1; index += 1) {
            var parent = parts.slice(index).join('.');
            domains.push(parent);
            domains.push('.' + parent);
          }
        }
        for (var domainIndex = 0; domainIndex < domains.length; domainIndex += 1) {
          var domain = domains[domainIndex];
          document.cookie = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT' + (domain ? '; domain=' + domain : '');
        }
        var googleCookie = 'googtrans=/en/' + language + '; path=/';
        document.cookie = googleCookie;
        for (var cookieIndex = 1; cookieIndex < domains.length; cookieIndex += 1) {
          document.cookie = googleCookie + '; domain=' + domains[cookieIndex];
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
